name: Build OpenWrt IPK

on:
  push:
    branches:
      - main # Trigger on pushes to the main branch
  workflow_dispatch: # Allow manual triggering from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest # Use the latest Ubuntu runner

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up OpenWrt Buildroot Environment
      # This step sets up a basic OpenWrt build environment
      # It downloads and prepares a minimal OpenWrt SDK or buildroot
      # For a custom package, a full buildroot might be overkill, but ensures consistency.
      # You might need to adjust the OpenWrt version.
      run: |
        OPENVRT_SDK_VERSION="24.10.2" # Example version, choose based on your target router
        OPENVRT_SDK_URL="https://downloads.openwrt.org/releases/24.10.2/targets/armsr/armv8/openwrt-sdk-24.10.2-armsr-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
        
        # Determine target based on your router's architecture (e.g., ramips/mt7621)
        # You need to find the correct SDK for your router.
        # Check: https://downloads.openwrt.org/releases/

        # Create a build directory
        mkdir openwrt-build && cd openwrt-build

        # Download and extract SDK
        wget "${OPENVRT_SDK_URL}" -O openwrt-sdk.tar.xz
        tar -xf openwrt-sdk.tar.xz --strip-components=1

        # Update feeds and install all available packages
        ./scripts/feeds update -a
        ./scripts/feeds install -a

        # Enable non-free packages if needed (e.g., if you use proprietary drivers)
        # sed -i 's/^#\(.*src-git packages\)/\1/' feeds.conf.default
        
        # Prepare for package building (minimal config)
        make defconfig

        # Copy your package Makefile into the SDK's package directory
        # This assumes your Makefile is at the root of your GitHub repo
        cp -r ../Makefile package/${{ github.event.repository.name }}
        mkdir -p package/${{ github.event.repository.name }}/etc/init.d
        cp ../etc/init.d/modem-auto-reboot package/${{ github.event.repository.name }}/etc/init.d/
        mkdir -p package/${{ github.event.repository.name }}/usr/lib/lua/luci/model/cbi
        cp ../usr/lib/lua/luci/model/cbi/modem-auto-reboot.lua package/${{ github.event.repository.name }}/usr/lib/lua/luci/model/cbi/

    - name: Compile IPK package
      working-directory: openwrt-build
      run: |
        # Build your specific package
        make package/${{ github.event.repository.name }}/compile V=s

    - name: Find and upload IPK
      uses: actions/upload-artifact@v4
      with:
        name: modem-auto-reboot-ipk
        path: openwrt-build/bin/packages/*/base/modem-auto-reboot_*.ipk
